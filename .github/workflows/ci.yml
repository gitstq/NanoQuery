name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run built-in selftest (zero dependencies)
        run: python -m nanoquery selftest

      - name: Smoke check CLI on example data
        run: |
          python -m nanoquery "SELECT city, COUNT(*) AS orders, ROUND(SUM(amount), 2) AS gmv FROM sales GROUP BY city ORDER BY gmv DESC" examples/sales.csv
          python -m nanoquery schema examples/sales.csv
          python -m nanoquery import examples/sales.csv -o sales.nq
          python -m nanoquery "SELECT product, SUM(qty) AS q FROM sales GROUP BY product ORDER BY q DESC LIMIT 3" -t sales=sales.nq

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanoquery-dist
          path: dist/
